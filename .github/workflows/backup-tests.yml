name: Backup security tests
on:
  push:
    branches: [feature/encrypted-backups]
  pull_request:
    paths:
      - 'index.html'
      - 'encrypted-backup.js'
      - 'tests/**'
      - '.github/workflows/backup-tests.yml'
jobs:
  tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run all Node regressions
        run: node --test tests/*.test.cjs
