name: Financial insights tests
on:
  push:
    branches: [feature/annual-bills-and-debt, feature/financial-insights-demo-data]
  pull_request:
    paths:
      - 'index.html'
      - 'money-insights.js'
      - 'sw.js'
      - 'tests/**'
      - '.github/workflows/financial-insights-tests.yml'
jobs:
  tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/*.test.cjs
