name: Financial insights tests
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'index.html'
      - 'money-insights.js'
      - 'money-levels.js'
      - 'ui.css'
      - 'package.json'
      - 'package-lock.json'
      - 'sw.js'
      - 'tests/**'
      - '.github/workflows/financial-insights-tests.yml'
jobs:
  tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run test:browser
        env:
          MONEY_JOURNEY_SCREENSHOTS: test-artifacts/money-journey
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: money-journey-browser-review
          path: test-artifacts/money-journey
          if-no-files-found: ignore
