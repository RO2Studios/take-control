name: Financial insights tests
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'index.html'
      - 'money-insights.js'
      - 'money-levels.js'
      - 'ui.css'
      - 'package.json'
      - 'package-lock.json'
      - 'sw.js'
      - 'tests/**'
      - '.github/workflows/financial-insights-tests.yml'
jobs:
  tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run test:browser
        env:
          MONEY_JOURNEY_SCREENSHOTS: test-artifacts/money-journey
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: money-journey-browser-review
          path: test-artifacts/money-journey
          if-no-files-found: ignore
